name: revpred-p9

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    image: revpred-api:p9
    ports:
      - "8000:8000"
    environment:
      - PYTHONHASHSEED=0
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ui
    image: revpred-ui:p9
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
      - PYTHONHASHSEED=0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

